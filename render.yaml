databases:
  - name: tasktrack-ass2-db
    databaseName: task_management_ass2
    user: taskadmin
    plan: free
services:
  - type: web
    name: qe190009-tasktrack-ass2-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tasktrack-ass2-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__AllowedOrigins__0
        sync: false
